<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Lookup AI</title>
<link rel="stylesheet" href="popup.css" />
<link rel="stylesheet" href="vendor/katex.min.css" />
</head>
<body>
  <div class="panel">
    <div class="titlebar">
      <span class="titlebar-label">Lookup AI</span>
      <div class="titlebar-actions">
        <button id="historyBtn" title="History">
          <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="10" cy="10.5" r="7" />
            <path d="M10 6.5v4l2.8 1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <button id="closeBtn" title="Close (Esc)">×</button>
      </div>
    </div>
    <div id="historyPanel" class="history-panel" hidden>
      <div class="history-header">
        <span>Recent chats</span>
        <button id="clearHistoryBtn">Clear</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </div>
    <div class="controls">
      <select id="backend"></select>
      <select id="model" hidden></select>
      <select id="effort" hidden></select>
    </div>
    <div id="selectedPreview" class="selected-preview" hidden></div>
    <div id="conversation" class="conversation"></div>
    <div id="status" class="status" hidden></div>
    <textarea id="promptInput" placeholder="Ask something…" rows="2"></textarea>
    <button id="submitBtn">Ask <span class="kbd">⏎</span></button>
  </div>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/katex.min.js"></script>
  <script src="vendor/auto-render.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
