<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Lookup AI Settings</title>
<link rel="stylesheet" href="settings.css" />
</head>
<body>
  <h2>Lookup AI Settings</h2>

  <label>Global shortcut</label>
  <input id="shortcut" placeholder="CommandOrControl+E" />
  <p class="hint">Uses Electron accelerator format, e.g. CommandOrControl+E, CommandOrControl+Shift+K.</p>

  <hr />

  <h3>Backends</h3>
  <div id="backendsList"></div>

  <hr />
  <button id="saveBtn">Save</button>
  <span id="savedMsg" class="hint" hidden>Saved.</span>

  <script src="settings.js"></script>
</body>
</html>
