[project]
name = "ollie"
version = "0.1.0"
description = "A voice narrator for terminal coding agents"
requires-python = ">=3.10"
dependencies = [
    "mlx-whisper>=0.4",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "pynput>=1.7",
    "httpx>=0.27",
    "pyobjc-framework-Cocoa>=10.3",
    "pyobjc-framework-Quartz>=10.3",
]

[project.scripts]
ollie = "ollie.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ollie"]
