[project]
name = "ollie"
version = "0.2.0"
description = "A voice narrator for terminal coding agents"
requires-python = ">=3.10"
dependencies = [
    "mlx-whisper>=0.4",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "httpx>=0.27",
    "huggingface_hub>=0.23",
    "pyobjc-framework-Cocoa>=10.3",
    "pyobjc-framework-ApplicationServices>=10.3",
    "pyobjc-framework-Quartz>=10.3",
    "pyobjc-framework-AVFoundation>=10.3",
]

[project.optional-dependencies]
kokoro = ["mlx-audio>=0.4", "misaki[en]>=0.6"]
dev = ["pytest>=8"]

[project.scripts]
ollie = "ollie.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ollie"]
